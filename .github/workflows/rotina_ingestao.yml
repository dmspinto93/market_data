name: Web Scraping Diário e Ingestão

on:
  schedule:
    - cron: '0 9 * * *' # Roda todos os dias às 9h (UTC)
  workflow_dispatch:

jobs:
  scrape-and-load:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
        with:
          # Importante para permitir que o bot faça commit de volta
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 pandas sqlalchemy psycopg2-binary

      - name: Subir o PostgreSQL via Docker
        run: docker compose up -d

      - name: Aguardar o banco de dados iniciar
        run: sleep 10

      - name: Rodar o script de Scraping e Ingestão
        run: python src/main.py
        env:
          POSTGRES_USER: seu_usuario
          POSTGRES_PASSWORD: sua_senha
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: varejo_db

      - name: Salvar o novo CSV no GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/*.csv
          # Só faz o commit se houver arquivos novos
          git diff --quiet && git diff --staged --quiet || git commit -m "Adiciona CSV de preços diário"
          git push